<!doctype html>
<html lang="en" data-theme="wedding">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isaiah + Hillary</title>
  </head>
  <body>
    <div id="root"></div>
    <form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input name="bot-field" />
      <input name="full_name" />
      <input name="email" type="email" />
      <select name="attendance"><option value="accept">Accept</option><option value="decline">Decline</option></select>
      <select name="guests"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      <input name="dietary" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
